name: Daily Book Delivery

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  send_book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Calibre and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre fonts-wqy-zenhei

      - name: Pick, Convert and Send
        id: process
        shell: bash
        run: |
          set +e

          touch sent_books.txt skipped_books.txt
          find . -name "*.epub" | sort -u > all_books.txt
          sort -u sent_books.txt -o sent_books.txt
          sort -u skipped_books.txt -o skipped_books.txt

          FOUND=false
          SKIPPED_CHANGED=false

          while IFS= read -r BOOK_PATH; do
            if grep -Fxq "$BOOK_PATH" sent_books.txt; then
              continue
            fi

            if grep -Fxq "$BOOK_PATH" skipped_books.txt; then
              continue
            fi

            RAW_NAME=$(basename "$BOOK_PATH" .epub)
            PDF_PATH="${RAW_NAME}.pdf"

            echo "Trying: $BOOK_PATH"

            PRECHECK=$(python3 - "$BOOK_PATH" <<'PY'
import sys, zipfile

book = sys.argv[1]
html_count = -1
generator = ""

try:
    with zipfile.ZipFile(book) as zf:
        names = zf.namelist()
        html_count = sum(1 for name in names if name.lower().endswith((".html", ".xhtml")))
        for candidate in ("OEBPS/content.opf", "content.opf"):
            if candidate in names:
                data = zf.read(candidate).decode("utf-8", "ignore")
                if "EasyPub" in data:
                    generator = "EasyPub"
                break
except Exception:
    pass

print(f"{html_count}|{generator}")
PY
)

            HTML_COUNT=${PRECHECK%%|*}
            GENERATOR=${PRECHECK#*|}

            # 超大 EasyPub 网文在 Calibre PDF 渲染里经常卡死或报假性 style.css 错误
            # 这类书直接永久跳过，避免每天重复浪费 runner 时间
            if [ "${GENERATOR}" = "EasyPub" ] && [ "${HTML_COUNT}" -ge 3000 ]; then
              echo "Precheck skipped oversized EasyPub EPUB (${HTML_COUNT} HTML files): $BOOK_PATH"
              if ! grep -Fxq "$BOOK_PATH" skipped_books.txt; then
                echo "$BOOK_PATH" >> skipped_books.txt
                SKIPPED_CHANGED=true
              fi
              continue
            fi

            timeout 8m ebook-convert "$BOOK_PATH" "$PDF_PATH" --input-encoding utf-8 >/tmp/ebook-convert.log 2>&1
            CONVERT_STATUS=$?

            if [ "$CONVERT_STATUS" -eq 0 ]; then
              curl --fail-with-body -F document=@"${PDF_PATH}" \
                   -F caption="📅 今日书单: ${RAW_NAME}" \
                   "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument?chat_id=${{ secrets.TG_CHAT_ID }}"
              CURL_STATUS=$?

              if [ "$CURL_STATUS" -ne 0 ]; then
                echo "Telegram send failed: $BOOK_PATH"
                exit 1
              fi

              echo "$BOOK_PATH" >> sent_books.txt
              FOUND=true
              break
            else
              echo "Conversion failed, permanently skipping: $BOOK_PATH"
              if ! grep -Fxq "$BOOK_PATH" skipped_books.txt; then
                echo "$BOOK_PATH" >> skipped_books.txt
                SKIPPED_CHANGED=true
              fi
              rm -f "$PDF_PATH"
            fi
          done < all_books.txt

          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "skipped_changed=$SKIPPED_CHANGED" >> "$GITHUB_OUTPUT"

          if [ "$FOUND" = false ]; then
            echo "No valid unsent books left."
          fi

      - name: Save Progress
        if: steps.process.outputs.found == 'true' || steps.process.outputs.skipped_changed == 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add sent_books.txt skipped_books.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update sent/skipped books"
          else
            echo "No changes to commit"
          fi

          git pull origin main --rebase
          git push origin main
