name: Daily Book Delivery

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  send_book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Calibre and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre fonts-wqy-zenhei

      - name: Pick, Convert and Send
        id: process
        run: |
          touch sent_books.txt skipped_books.txt
          find . -name "*.epub" | sort > all_books.txt

          FOUND=false
          SENT_FILE=""
          SENT_CAPTION=""
          SENT_BOOK=""
          SKIPPED_CHANGED=false

          while IFS= read -r BOOK_PATH; do
            if grep -Fxq "$BOOK_PATH" sent_books.txt; then
              continue
            fi

            if grep -Fxq "$BOOK_PATH" skipped_books.txt; then
              continue
            fi

            RAW_NAME=$(basename "$BOOK_PATH" .epub)
            PDF_PATH="${RAW_NAME}.pdf"

            echo "Trying: $BOOK_PATH"

            if timeout 25m ebook-convert "$BOOK_PATH" "$PDF_PATH" --input-encoding utf-8; then
              curl --fail-with-body -F document=@"${PDF_PATH}" \
                   -F caption="📅 今日书单: ${RAW_NAME}" \
                   "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument?chat_id=${{ secrets.TG_CHAT_ID }}"

              echo "$BOOK_PATH" >> sent_books.txt
              FOUND=true
              SENT_BOOK="$BOOK_PATH"
              break
            else
              echo "Conversion failed, permanently skipping: $BOOK_PATH"
              if ! grep -Fxq "$BOOK_PATH" skipped_books.txt; then
                echo "$BOOK_PATH" >> skipped_books.txt
                SKIPPED_CHANGED=true
              fi
            fi
          done < all_books.txt

          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "skipped_changed=$SKIPPED_CHANGED" >> "$GITHUB_OUTPUT"

          if [ "$FOUND" = false ]; then
            echo "No valid unsent books left."
          fi

      - name: Save Progress
        if: steps.process.outputs.found == 'true' || steps.process.outputs.skipped_changed == 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add sent_books.txt skipped_books.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update sent/skipped books"
          else
            echo "No changes to commit"
          fi

          git pull origin main --rebase
          git push origin main
