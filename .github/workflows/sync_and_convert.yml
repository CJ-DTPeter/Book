name: Daily Book Delivery
on:
  schedule:
    - cron: '0 2 * * *' # 每天北京时间上午 10:00 运行
  workflow_dispatch:      # 支持手动触发

jobs:
  send_book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Pick One Book
        id: pick
        run: |
          find . -name "*.epub" > all_books.txt
          SELECTED=""
          while IFS= read -r line; do
            if ! grep -q "$line" sent_books.txt; then
              SELECTED="$line"
              break
            fi
          done < all_books.txt
          if [ -z "$SELECTED" ]; then
            echo "所有书籍已发送完毕！"
            exit 0
          fi
          echo "BOOK_PATH=$SELECTED" >> $GITHUB_ENV
          echo "found=true" >> $GITHUB_OUTPUT

      - name: Install Calibre
        if: steps.pick.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Convert and Send
        if: steps.pick.outputs.found == 'true'
        run: |
          RAW_NAME=$(basename "${{ env.BOOK_PATH }}" .epub)
          echo "正在转换: $RAW_NAME"
          ebook-convert "${{ env.BOOK_PATH }}" "${RAW_NAME}.pdf"
          # 注意：下面这一行必须完整包含 api.telegram.org/bot 以及 ${{ ... }} 前面的 $ 符号
          curl -v -F document=@"${RAW_NAME}.pdf" \
               -F caption="📅 今日书单: ${RAW_NAME}" \
               "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument?chat_id=${{ secrets.TG_CHAT_ID }}"

      - name: Save Progress
        if: steps.pick.outputs.found == 'true'
        run: |
          RAW_NAME=$(basename "${{ env.BOOK_PATH }}" .epub)
          echo "${{ env.BOOK_PATH }}" >> sent_books.txt
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add sent_books.txt
          git commit -m "Update: 已发送 $RAW_NAME"
          git push
