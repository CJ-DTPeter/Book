name: Daily Book Delivery
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  send_book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Pick One Book
        id: pick
        run: |
          # 确保 sent_books.txt 存在
          touch sent_books.txt

          find . -name "*.epub" | sort > all_books.txt

          SELECTED=""

          while IFS= read -r line; do
            # ⭐ 精确匹配（整行匹配）
            if ! grep -Fxq "$line" sent_books.txt; then
              SELECTED="$line"
              break
            fi
          done < all_books.txt

          if [ -z "$SELECTED" ]; then
            echo "All books sent."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "BOOK_PATH=$SELECTED" >> $GITHUB_ENV
          echo "found=true" >> $GITHUB_OUTPUT

      - name: Install Calibre and Fonts
        if: steps.pick.outputs.found == 'true'
        run: |
          sudo apt-get update
          # 安装 Calibre 以及中文字体，防止 PDF 乱码
          sudo apt-get install -y calibre fonts-wqy-zenhei

      - name: Convert and Send
        if: steps.pick.outputs.found == 'true'
        run: |
          RAW_NAME=$(basename "${{ env.BOOK_PATH }}" .epub)
          # 转换命令：特别指定输出编码为 utf-8
          ebook-convert "${{ env.BOOK_PATH }}" "${RAW_NAME}.pdf" --input-encoding utf-8
          
          curl -v -F document=@"${RAW_NAME}.pdf" \
               -F caption="📅 今日书单: ${RAW_NAME}" \
               "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument?chat_id=${{ secrets.TG_CHAT_ID }}"

      - name: Save Progress
        if: steps.pick.outputs.found == 'true'
        run: |
          RAW_NAME=$(basename "${{ env.BOOK_PATH }}" .epub)
          echo "${{ env.BOOK_PATH }}" >> sent_books.txt

          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add sent_books.txt

          # ⭐ 防止空提交导致失败
          if ! git diff --cached --quiet; then
            git commit -m "Update: $RAW_NAME"
          else
            echo "No changes to commit"
          fi

          # ⭐ 避免冲突
          git pull origin main --rebase
          git push origin main
