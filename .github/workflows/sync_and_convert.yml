name: EPUB to PDF and Push
on:
  schedule:
    - cron: '0 2 * * *' # 每天北京时间上午 10:00 自动检查一次更新
  workflow_dispatch:      # 允许你随时手动点击运行

jobs:
  check_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Fork
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 获取所有历史以对比更新

      - name: Sync with Upstream
        run: |
          git remote add upstream https://github.com
          git fetch upstream
          # 检查原作者是否有更新，获取最新变动的文件名
          NEW_FILES=$(git diff --name-only HEAD upstream/main | grep ".epub" || true)
          echo "NEW_FILES=$NEW_FILES" >> $GITHUB_ENV
          # 合并更新到你的仓库
          git merge upstream/main

      - name: Install Calibre (Conversion Tool)
        if: env.NEW_FILES != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Convert and Send
        if: env.NEW_FILES != ''
        run: |
          mkdir -p output
          for file in $NEW_FILES; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .epub)
              echo "Converting $file..."
              # 转换格式为 PDF
              ebook-convert "$file" "output/${filename}.pdf"
              
              # 发送到 Telegram
              curl -v -F document=@"output/${filename}.pdf" \
                   -F caption="📖 新书入库: ${filename}" \
                   "https://telegram.org{{ secrets.TG_TOKEN }}/sendDocument?chat_id=${{ secrets.TG_CHAT_ID }}"
            fi
          done
