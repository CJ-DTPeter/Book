name: Daily Book Delivery

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  send_book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Calibre and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre fonts-wqy-zenhei unzip

      - name: Pick, Convert and Send
        id: process
        shell: bash
        run: |
          set -u

          # Telegram Bot API uploads are small compared with ordinary Telegram clients.
          # Keep some headroom below the common 50 MiB document upload limit.
          MAX_UPLOAD_BYTES=$((49 * 1024 * 1024))

          touch sent_books.txt skipped_books.txt
          find . -name "*.epub" | sort -u > all_books.txt
          sort -u sent_books.txt -o sent_books.txt
          sort -u skipped_books.txt -o skipped_books.txt

          FOUND=false
          SKIPPED_CHANGED=false

          while IFS= read -r BOOK_PATH; do
            grep -Fxq "$BOOK_PATH" sent_books.txt && continue
            grep -Fxq "$BOOK_PATH" skipped_books.txt && continue

            RAW_NAME="$(basename "$BOOK_PATH" .epub)"
            PDF_PATH="${RAW_NAME}.pdf"

            echo "Trying: $BOOK_PATH"

            HTML_COUNT="$(
              unzip -Z1 "$BOOK_PATH" |
              grep -Eci '\.(html|xhtml)$'
            )"

            OPF_FILE="$(
              unzip -Z1 "$BOOK_PATH" |
              grep -E '(^|/)content\.opf$' |
              head -n 1
            )"

            IS_EASYPUB=false
            if [ -n "$OPF_FILE" ]; then
              if unzip -p "$BOOK_PATH" "$OPF_FILE" | grep -q "EasyPub"; then
                IS_EASYPUB=true
              fi
            fi

            if [ "$IS_EASYPUB" = true ] && [ "$HTML_COUNT" -ge 3000 ]; then
              echo "Skip oversized EasyPub EPUB (${HTML_COUNT} HTML files): $BOOK_PATH"
              echo "$BOOK_PATH" >> skipped_books.txt
              SKIPPED_CHANGED=true
              continue
            fi

            timeout 8m ebook-convert "$BOOK_PATH" "$PDF_PATH" --input-encoding utf-8 >/tmp/ebook-convert.log 2>&1
            CONVERT_STATUS=$?

            if [ "$CONVERT_STATUS" -ne 0 ]; then
              echo "Conversion failed, permanently skipping: $BOOK_PATH"
              cat /tmp/ebook-convert.log
              echo "$BOOK_PATH" >> skipped_books.txt
              SKIPPED_CHANGED=true
              rm -f "$PDF_PATH"
              continue
            fi

            PDF_SIZE="$(stat -c%s "$PDF_PATH")"
            if [ "$PDF_SIZE" -gt "$MAX_UPLOAD_BYTES" ]; then
              echo "PDF is too large for Telegram Bot upload: $PDF_PATH (${PDF_SIZE} bytes)"
              echo "Permanently skipping: $BOOK_PATH"
              echo "$BOOK_PATH" >> skipped_books.txt
              SKIPPED_CHANGED=true
              rm -f "$PDF_PATH"
              continue
            fi

            curl --fail-with-body \
              -F document=@"$PDF_PATH" \
              -F caption="📅 今日书单: ${RAW_NAME}" \
              "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendDocument?chat_id=${{ secrets.TG_CHAT_ID }}"

            CURL_STATUS=$?
            if [ "$CURL_STATUS" -ne 0 ]; then
              echo "Telegram send failed, marking as skipped to avoid retry loop: $BOOK_PATH"
              echo "$BOOK_PATH" >> skipped_books.txt
              SKIPPED_CHANGED=true
              rm -f "$PDF_PATH"
              continue
            fi

            echo "$BOOK_PATH" >> sent_books.txt
            FOUND=true
            rm -f "$PDF_PATH"
            break
          done < all_books.txt

          sort -u sent_books.txt -o sent_books.txt
          sort -u skipped_books.txt -o skipped_books.txt

          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "skipped_changed=$SKIPPED_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Save Progress
        if: steps.process.outputs.found == 'true' || steps.process.outputs.skipped_changed == 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          git add sent_books.txt skipped_books.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update sent/skipped books"
          else
            echo "No changes to commit"
          fi

          git pull origin main --rebase
          git push origin main
